[package]
name = "ba-click-tauri"
version = "0.1.0"
description = "macOS click-through Tauri overlay for ba-click-fx"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5.3"

[lib]
name = "ba_click_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
