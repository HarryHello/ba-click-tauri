[package]
name = "ba-click-tauri"
version = "0.1.1"
description = "macOS click-through Tauri overlay for ba-click-fx"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png", "tray-icon"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
serde = { version = "1", features = ["derive"] }
core-foundation = "0.10"
core-graphics = "0.25"
window-vibrancy = "0.6"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"

[lib]
name = "ba_click_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
