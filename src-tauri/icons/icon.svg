<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- White background -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- Concentric arcs, center (512,512) -->
  <!-- Top-right arc: larger radius, darker blue, square caps -->
  <path
    d="M 601.3 178.7 A 345 345 0 0 1 845.2 422.7"
    fill="none"
    stroke="#2563EB"
    stroke-width="58"
    stroke-linecap="square"
  />
  <!-- Bottom-left arc: smaller radius (slightly larger), lighter blue, square caps -->
  <path
    d="M 412.7 725.0 A 235 235 0 0 1 280.6 552.8"
    fill="none"
    stroke="#60A5FA"
    stroke-width="50"
    stroke-linecap="square"
  />

  <!-- Equilateral triangles: upright (point up) or inverted (point down) only -->
  <!-- Upright -->
  <polygon points="230,145 175,288 285,288" fill="#3B82F6"/>
  <!-- Inverted -->
  <polygon points="780,367 730,237 830,237" fill="#60A5FA"/>
  <!-- Upright -->
  <polygon points="230,656 170,812 290,812" fill="#7DD3FC"/>
  <!-- Inverted -->
  <polygon points="790,875 735,732 845,732" fill="#1D4ED8"/>
  <!-- Upright -->
  <polygon points="480,102 435,219 525,219" fill="#2563EB"/>

  <!-- Center dot -->
  <circle cx="512" cy="512" r="34" fill="#1E40AF"/>
</svg>
