<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- White background -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- Concentric arcs, center (512,512) -->
  <!-- Top-right arc: larger radius, darker blue, square caps -->
  <path
    d="M 851.8 452.1 A 345 345 0 0 1 571.9 851.8"
    fill="none"
    stroke="#2563EB"
    stroke-width="58"
    stroke-linecap="square"
  />
  <!-- Bottom-left arc: smaller radius, lighter blue, square caps -->
  <path
    d="M 310.0 438.5 A 215 215 0 0 1 474.7 300.3"
    fill="none"
    stroke="#60A5FA"
    stroke-width="50"
    stroke-linecap="square"
  />

  <!-- Random triangles with varied blue shades -->
  <polygon points="200,180 160,260 250,250" fill="#3B82F6"/>
  <polygon points="760,220 900,240 840,330" fill="#60A5FA"/>
  <polygon points="800,760 930,740 850,860" fill="#1D4ED8"/>
  <polygon points="150,720 250,740 200,840" fill="#7DD3FC"/>
  <polygon points="760,520 700,590 820,610" fill="#2563EB"/>

  <!-- Center dot -->
  <circle cx="512" cy="512" r="34" fill="#1E40AF"/>
</svg>
