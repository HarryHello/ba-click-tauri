name: release

# Builds the macOS DMG on GitHub's macOS runner, creates a GitHub Release,
# and uploads the DMG as an asset. Runs when a tag like `v0.1.0` is pushed.
#
# To sign & notarize (recommended for public distribution) configure secrets:
#   APPLE_CERTIFICATE          base64 of your Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password of that .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_API_KEY              base64 of your App Store Connect AuthKey_XXXX.p8
#   APPLE_API_ISSUER           your App Store Connect issuer ID
#   APPLE_API_KEY_PATH         path where the .p8 is written (e.g. ~/.certs/AuthKey_XXXX.p8)
# See https://tauri.app/distribute/sign/macos/ for details.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: signing + notarization. Without these the DMG is unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ''
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false