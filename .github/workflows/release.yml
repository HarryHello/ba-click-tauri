name: release

# Builds macOS DMGs for both Apple Silicon (aarch64) and Intel (x86_64) on
# GitHub's macOS runners, creates a GitHub Release, and uploads the DMGs.
# Runs when a tag like `v0.1.0` is pushed.
#
# To sign & notarize (recommended for public distribution) configure secrets:
#   APPLE_CERTIFICATE          base64 of your Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password of that .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_API_KEY              base64 of your App Store Connect AuthKey_XXXX.p8
#   APPLE_API_ISSUER           your App Store Connect issuer ID
#   APPLE_API_KEY_PATH         path where the .p8 is written (e.g. ~/.certs/AuthKey_XXXX.p8)
# See https://tauri.app/distribute/sign/macos/ for details.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: unsigned builds only. To sign/notarize, re-add the APPLE_*
          # env vars here only after the secrets are configured. Passing them
          # as empty strings makes tauri-action try to import a certificate.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ''
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
