name: release

# Builds macOS DMGs for both Apple Silicon (aarch64) and Intel (x86_64) on
# GitHub's macOS runners, creates a GitHub Release, and uploads the DMGs.
# Runs when a tag like `v0.1.0` is pushed.
#
# To sign with the self-signed certificate, configure these secrets:
#   APPLE_CERTIFICATE          base64 of the exported .p12
#   APPLE_CERTIFICATE_PASSWORD password of that .p12
#   APPLE_SIGNING_IDENTITY     e.g. "BA Click Tauri Signing"
# (Notarization is not supported with a self-signed certificate; leave the
# APPLE_API_* / APPLE_ID secrets unset.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Prepare release notes from CHANGELOG
        id: release-notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = re.compile(rf'^## \[{re.escape(version)}\]', re.MULTILINE)
          match = pattern.search(text)
          if not match:
              body = ''
          else:
              nxt = re.compile(r'^## \[', re.MULTILINE)
              nxt_match = nxt.search(text, match.end())
              body = text[match.end():nxt_match.start() if nxt_match else len(text)].strip()
          pathlib.Path('/tmp/release-body.md').write_text(body + '\n', encoding='utf-8')
          PY
          {
            echo "body<<EOF"
            cat /tmp/release-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup self-signed certificate
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > /tmp/BA-Click-Tauri-Signing.p12
          LOGIN="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "" "$LOGIN" || true
          security import /tmp/BA-Click-Tauri-Signing.p12 \
            -k "$LOGIN" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign
          security find-certificate -c "BA Click Tauri Signing" -p > /tmp/ba-cert.pem
          sudo security add-trusted-cert -r trustRoot -k "$LOGIN" /tmp/ba-cert.pem
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "" \
            "$LOGIN" || true
          security find-identity -v -p codesigning

      - name: Build & release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
